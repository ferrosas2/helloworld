# =============================================================================
# Cloud Build: CI/CD Pipeline for Streaming Fraud Detection
# =============================================================================
# Triggered on push to main branch. Implements an 8-step pipeline:
#   1. Unit tests (pytest + coverage)
#   2. Security scanning (Trivy — filesystem scan)
#   3. Docker build (tagged with git SHA + latest)
#   4. Push to Artifact Registry
#   5. Container image vulnerability scan
#   6. Deploy to staging (scale-to-zero, max 10 instances)
#   7. Integration tests against staging URL
#   8. Deploy to production (min 1, max 50 instances)
#
# Security scanning happens at TWO stages:
#   - Pre-build: Trivy filesystem scan catches dependency vulnerabilities
#   - Post-build: Container image scan catches runtime vulnerabilities
# =============================================================================

steps:
  # ─── Step 1: Run unit tests with coverage ───────────────────────────────
  - name: 'python:3.10-slim'
    id: 'run-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --quiet -r requirements.txt
        pip install --quiet pytest pytest-cov pytest-asyncio httpx
        pytest tests/ \
          --cov=src --cov=api --cov=pipeline \
          --cov-report=term-missing \
          --cov-fail-under=70 \
          -v || exit 1
    waitFor: ['-']

  # ─── Step 2: Security scan (Trivy filesystem) ──────────────────────────
  - name: 'aquasec/trivy:latest'
    id: 'security-scan-fs'
    args:
      - 'fs'
      - '--severity'
      - 'HIGH,CRITICAL'
      - '--exit-code'
      - '0'
      - '--format'
      - 'table'
      - '.'
    waitFor: ['-']

  # ─── Step 3: Build Docker image ────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'
      - '--build-arg'
      - 'BUILD_SHA=${SHORT_SHA}'
      - '.'
    waitFor: ['run-tests']

  # ─── Step 4: Push to Artifact Registry ─────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}'
    waitFor: ['build-image']

  # ─── Step 5: Container vulnerability scan (post-push) ──────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'scan-container'
    args:
      - 'artifacts'
      - 'docker'
      - 'images'
      - 'scan'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--location=${_REGION}'
      - '--format=json'
    waitFor: ['push-image']

  # ─── Step 6: Deploy to Staging ─────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-staging'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}-staging'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${_REGION},GCS_BUCKET_NAME=${_GCS_BUCKET},VERTEX_PREDICTION_ENDPOINT_ID=${_VERTEX_PREDICTION_ENDPOINT},VERTEX_INDEX_ID=${_VERTEX_INDEX_ID},VERTEX_ENDPOINT_ID=${_VERTEX_ENDPOINT_ID},GEMINI_MODEL=gemini-2.5-flash,HIGH_RISK_THRESHOLD=0.7,MEDIUM_RISK_THRESHOLD=0.3,LOG_LEVEL=DEBUG'
      - '--service-account=${_SERVICE_ACCOUNT}'
      - '--max-instances=10'
      - '--min-instances=0'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=300'
      - '--concurrency=80'
    waitFor: ['scan-container']

  # ─── Step 7: Integration tests against staging ─────────────────────────
  - name: 'python:3.10-slim'
    id: 'integration-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --quiet requests pytest httpx
        export STAGING_URL=$(gcloud run services describe ${_SERVICE_NAME}-staging \
          --region=${_REGION} --format='value(status.url)')
        echo "Running integration tests against: $STAGING_URL"

        # Health check
        curl -f "$STAGING_URL/health" || exit 1

        # Readiness check
        curl -f "$STAGING_URL/readiness" || exit 1

        # Score a test transaction
        curl -f -X POST "$STAGING_URL/api/v1/score-transaction" \
          -H "Content-Type: application/json" \
          -d '{"transaction_id":"test-001","card_token":"card_test_abc","merchant_id":"m_test","merchant_category":"electronics","amount":150.00}' \
          || exit 1

        echo "Integration tests passed."
    waitFor: ['deploy-staging']

  # ─── Step 8: Deploy to Production ──────────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-production'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${_REGION},GCS_BUCKET_NAME=${_GCS_BUCKET},VERTEX_PREDICTION_ENDPOINT_ID=${_VERTEX_PREDICTION_ENDPOINT},VERTEX_INDEX_ID=${_VERTEX_INDEX_ID},VERTEX_ENDPOINT_ID=${_VERTEX_ENDPOINT_ID},GEMINI_MODEL=gemini-2.5-flash,HIGH_RISK_THRESHOLD=0.7,MEDIUM_RISK_THRESHOLD=0.3,LOG_LEVEL=INFO'
      - '--service-account=${_SERVICE_ACCOUNT}'
      - '--max-instances=50'
      - '--min-instances=1'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=300'
      - '--concurrency=80'
      - '--tag=prod-${SHORT_SHA}'
    waitFor: ['integration-tests']

# =============================================================================
# Substitution Variables (override per environment)
# =============================================================================
substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REPO: 'streaming-fraud-detection'
  _SERVICE_NAME: 'streaming-fraud-api'
  _GCS_BUCKET: 'your-fraud-detection-bucket'
  _VERTEX_PREDICTION_ENDPOINT: 'your-prediction-endpoint-id'
  _VERTEX_INDEX_ID: 'your-vector-search-index-id'
  _VERTEX_ENDPOINT_ID: 'your-vector-search-endpoint-id'
  _SERVICE_ACCOUNT: 'streaming-fraud-api-sa@${PROJECT_ID}.iam.gserviceaccount.com'

# Build machine configuration
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Pipeline timeout (30 minutes)
timeout: '1800s'

# Images pushed to Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'
